spring:
  application:
    name: spaceops

  datasource:
    url: jdbc:h2:mem:spaceops;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Sao_Paulo

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# Configuracao customizada da aplicacao
app:
  security:
    jwt:
      # Em producao, mover para variavel de ambiente (JWT_SECRET)
      secret: ${JWT_SECRET:b3JiaXRhbC1ndWFyZC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tc2lnbmluZy1zcGFjZW9wcw==}
      # Tempo de expiracao em milissegundos (1 hora)
      expiration: 3600000
      issuer: spaceops-api

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Logging
logging:
  level:
    root: INFO
    com.fiap.spaceops: DEBUG
    org.springframework.security: INFO
